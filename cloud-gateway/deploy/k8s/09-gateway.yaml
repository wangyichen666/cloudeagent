# cloud-gateway：数据面网关（backend 与 Pod 内 agent 之间唯一的连接层）。
# backend 创建/唤醒实例后把 endpoint 注册到这里，所有对话/会话/历史/配置
# 都经它转发，backend 不直连 Pod。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-gateway
  namespace: cloude-backend
  labels:
    app: cloude-agent
    role: data-plane-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloude-agent
      role: data-plane-gateway
  template:
    metadata:
      labels:
        app: cloude-agent
        role: data-plane-gateway
    spec:
      containers:
        - name: gateway
          image: cloude-gateway:local
          imagePullPolicy: IfNotPresent
          args:
            - --listen=0.0.0.0:18500
          ports:
            - containerPort: 18500
              name: gw
          readinessProbe:
            httpGet:
              path: /healthz
              port: 18500
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: cloude-gateway
  namespace: cloude-backend
spec:
  selector:
    app: cloude-agent
    role: data-plane-gateway
  ports:
    - port: 18500
      targetPort: 18500
