# 文档「七、安全隔离」：默认拒绝，只放行 控制面 -> 数据面 与出站 DNS/模型 API。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all-ingress
  namespace: cloude-agent
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
  ingress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-control-plane
  namespace: cloude-agent
spec:
  podSelector:
    matchLabels:
      role: data-plane
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: cloude-backend
      ports:
        - protocol: TCP
          port: 18585
