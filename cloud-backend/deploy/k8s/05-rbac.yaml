# 控制面 ServiceAccount 最小权限（文档：RBAC 最小权限）
apiVersion: v1
kind: ServiceAccount
metadata:
  name: control-plane
  namespace: cloude-backend
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-instance-operator
  namespace: cloude-agent
rules:
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "persistentvolumeclaims", "services", "configmaps", "secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: control-plane-agent-operator
  namespace: cloude-agent
subjects:
  - kind: ServiceAccount
    name: control-plane
    namespace: cloude-backend
roleRef:
  kind: Role
  name: agent-instance-operator
  apiGroup: rbac.authorization.k8s.io
