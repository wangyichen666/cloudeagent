# 控制面 Service（NodePort）：供宿主机/前端直连集群控制面。
# 前端 dev 代理默认指向 http://127.0.0.1:30080（见 cloud-web/vite.config.ts），
# 无需每次手动 kubectl port-forward；本地进程后端场景可用 VITE_API_BASE 覆盖回 127.0.0.1:18080。
apiVersion: v1
kind: Service
metadata:
  name: control-plane-svc
  namespace: cloude-backend
  labels:
    app: cloude-agent
    role: control-plane
spec:
  type: NodePort
  selector:
    app: cloude-agent
    role: control-plane
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080
