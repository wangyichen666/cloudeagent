# 演示用假 OpenAI 兼容模型服务：让 Pod 内的 QwenPaw 在无真实凭证时也能
# 走通「ACP → 模型调用 → 回复」全链路。生产环境替换为真实模型网关。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-openai
  namespace: cloude-agent
  labels:
    app: cloude-agent
    role: mock-model
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloude-agent
      role: mock-model
  template:
    metadata:
      labels:
        app: cloude-agent
        role: mock-model
    spec:
      containers:
        - name: mock
          image: python:3.12-slim
          command:
            - python3
            - -c
            - |
              from http.server import BaseHTTPRequestHandler, HTTPServer
              import json
              class H(BaseHTTPRequestHandler):
                  def do_POST(self):
                      n = int(self.headers.get('Content-Length', 0))
                      req = self.rfile.read(n).decode()
                      print('REQ', self.path, req[:120], flush=True)
                      self.send_response(200)
                      self.send_header('Content-Type', 'text/event-stream')
                      self.end_headers()
                      for chunk in ['【集群内 mock 模型】QwenPaw 在 Pod 内完成了模型调用，回复如下。']:
                          data = json.dumps(
                              {'choices': [{'delta': {'content': chunk}, 'index': 0}]},
                              ensure_ascii=False,
                          )
                          self.wfile.write(('data: ' + data + '\n\n').encode())
                          self.wfile.flush()
                      self.wfile.write(b'data: [DONE]\n\n')
                      self.wfile.flush()
                  def log_message(self, *args):
                      pass
              HTTPServer(('0.0.0.0', 19999), H).serve_forever()
          ports:
            - containerPort: 19999
---
apiVersion: v1
kind: Service
metadata:
  name: mock-openai
  namespace: cloude-agent
spec:
  selector:
    app: cloude-agent
    role: mock-model
  ports:
    - port: 19999
      targetPort: 19999
